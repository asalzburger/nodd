<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650">
<rect width="1100" height="650" fill="#fff"/>
<g font-family="sans-serif" fill="#172033">
<text x="35" y="40" font-size="25">DES-007 · repeated rectangular strixel module</text>
<text x="35" y="70" font-size="16">PROTOTYPE · proposed dimensions; sensor, ASIC tiling and mechanics unsigned</text>
<rect x="95" y="115" width="196" height="412" fill="#eef2f7" stroke="#64748b"/>
<rect x="97" y="127" width="192" height="2" fill="#d3a144"/>
<rect x="97" y="129" width="192" height="384" fill="#c9ecec" stroke="#157f82"/>
<rect x="97" y="513" width="192" height="2" fill="#d3a144"/>
<text x="130" y="294" font-size="18">Active sensor</text>
<text x="118" y="326" font-size="18">48 × 96 mm²</text>
<text x="114" y="356" font-size="16">640 × 192 cells</text>
<text x="110" y="382" font-size="15">75 µm × 0.5 mm</text>
<text x="85" y="557" font-size="15">Trial body: 49 × 103 mm²</text>
<text x="85" y="584" font-size="15">0.5 mm edge; 3 mm service space</text>
<text x="85" y="607" font-size="15">at each radial end (C05)</text>
<path d="M315 515 V131 M310 140 L315 131 L320 140" stroke="#172033" fill="none"/>
<text x="328" y="324" font-size="15">radial v</text>
<path d="M97 102 H289 M280 97 L289 102 L280 107" stroke="#172033" fill="none"/>
<text x="130" y="96" font-size="14">tangential u</text>
<text x="450" y="125" font-size="20">Functional stack · schematic, not to scale</text>
<rect x="450" y="153" width="555" height="47" fill="#c9ecec" stroke="#157f82"/>
<text x="470" y="182" font-size="17">200 µm n-in-p DC-coupled sensor (C02)</text>
<rect x="450" y="212" width="555" height="39" fill="#eedcaa" stroke="#b28c30"/>
<text x="470" y="238" font-size="16">Bumps / redistribution — layout to establish</text>
<rect x="450" y="263" width="555" height="54" fill="#d6d4f2" stroke="#7770b2"/>
<text x="470" y="296" font-size="17">Tiled readout ASICs — compatible chip unresolved</text>
<rect x="450" y="329" width="555" height="41" fill="#e6e8ed" stroke="#7f8795"/>
<text x="470" y="356" font-size="16">Adhesive / thermal contact / local stiffener</text>
<rect x="450" y="382" width="555" height="46" fill="#e5edf7" stroke="#6780a1"/>
<text x="470" y="411" font-size="16">Shared ring support and cooling — outside fixture</text>
<text x="450" y="473" font-size="17">Flex routes bias, power and data to ring services.</text>
<text x="450" y="505" font-size="16">2 mm trial body thickness is a collision-screen input,</text>
<text x="450" y="529" font-size="16">not the sum of engineered layer thicknesses.</text>
<text x="450" y="568" font-size="16">No resolved power, material budget or ASIC seam map.</text>
<text x="450" y="596" font-size="16">Barrel reuse needs a separate stave-coverage study.</text>
</g></svg>
