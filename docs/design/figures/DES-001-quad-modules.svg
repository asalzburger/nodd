<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc">
 <title id="title">Alternative B: four RD53i chips on one planar sensor</title>
 <desc id="desc">Draft module-only schematic, not to scale. A two-by-two quad has outward bond peripheries and unresolved seams. The cross-section places the flex and attachment epoxy on the sensor back, opposite bumps and chips. Local passives and the module termination are included. Proposed study thicknesses await approval.</desc>
