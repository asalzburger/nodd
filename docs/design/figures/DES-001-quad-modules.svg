 <text x="728" y="719">Flex: 50 µm total polyimide films</text>
 <text x="728" y="741">+ 2 × 18 µm patterned copper</text>
 <text x="728" y="763">Flex epoxy bondline: 25 µm proposed</text>
 <text x="728" y="786">Sensor silicon: 150 µm proposed</text>
 <text x="728" y="809">Bump standoff: 20 µm; alloy TBD</text>
 <text x="728" y="833">Chip silicon: 150 µm proposed</text>
 <text x="100" y="880" class="small">Wire loops: 25 µm aluminium diameter proposed; loop shape, counts and pad compatibility TBD.</text>
 <text x="100" y="905" class="small">Flex is on the sensor back. Chip pad ledges remain exposed beyond the sensor edge.</text>
 <text x="100" y="930" class="small">Exposed chip backs end the drawing. Module boundary excludes mounting, cooling and external services.</text>
 <text x="35" y="980">Partial reference crossing: 0.5884% X0 for silicon + polyimide + full copper coverage only.</text>
 <text x="35" y="1006" class="small">Not a complete budget or area average: adhesives, bumps, wires, finishes, passives and termination remain unclosed.</text>
 <text x="35" y="1031" class="small">No scale, clearance, seam efficiency, routing or manufacturing qualification is implied by this schematic.</text>
