<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="860" viewBox="0 0 1100 860" role="img" aria-labelledby="title desc">
 <title id="title">Alternative B: common sensor four-chip ITkPix hybrid</title>
 <desc id="desc">Draft schematic, not to scale. Four chips have outward-facing bond peripheries, a common sensor, backside flex and chip-back thermal interface to shared cooled support. Gaps and services remain unresolved.</desc>
