<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
<title id="title">DES-001 alternative A: compact RD53 modules</title>
<desc id="desc">Original draft schematic, not to scale. A1 has one chip; optional A2 has two side-by-side chips under a shared sensor, aligned bond access and a shared flex tail. Cross section shows sensor, bumps, die, thermal joint and DES-002 support boundary.</desc>
