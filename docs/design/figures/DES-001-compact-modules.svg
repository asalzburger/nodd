<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1000" viewBox="0 0 1280 1000" role="img" aria-labelledby="title desc">
<title id="title">Alternative A: compact RD53i module proposal</title>
<desc id="desc">Top views of single-chip A1 and optional two-chip A2; common cross-section has flex on sensor backside, adhesive, silicon sensor, discrete bumps, and RD53i chip underneath. Exposed chip pads connect by wire around the sensor edge to the flex. Thicknesses are proposed study values, not certified dimensions. Module infrastructure is excluded.</desc>
