name: Token usage Pages

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: token-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  token-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate canonical usage
        run: python3 -B tools/session_logging/session_log.py validate
      - name: Validate interaction and accounting synchronization
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 -B tools/interactions/ledger.py validate
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            python3 -B tools/interactions/ledger.py validate --base-ref "$BASE_SHA"
          fi
          if [ -n "$PR_NUMBER" ]; then
            python3 -B tools/interactions/ledger.py validate --pr "$PR_NUMBER"
          fi
      - name: Test interaction provenance and accounting boundaries
        run: python3 -B -m unittest discover -s tools/interactions -p 'test_*.py' -v
      - name: Test usage arithmetic, timeline and site
        run: python3 -B -m unittest discover -s tools/token_usage -p 'test_*.py' -v
      - name: Test chart interaction
        run: node tools/token_usage/test_app.js
      - name: Build token dashboard
        run: python3 -B tools/token_usage/build.py build --output _site/pages
      - uses: actions/upload-artifact@v7
        with:
          name: token-usage-preview
          path: _site/pages/
          if-no-files-found: error
          retention-days: 14
      - name: Package token Pages site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/pages/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: token-site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy token dashboard
        id: deployment
        uses: actions/deploy-pages@v4
