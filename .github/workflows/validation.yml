name: Project validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unrooted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 0 # Audit executed native sources at their preserved launch revision.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install pinned documentation plotting environment
        run: python -m pip install -r software/analysis/requirements-unrooted.txt
      - name: Check ROOT histogram reading and documentation plot exports
        run: python -I software/analysis/unrooted_smoke.py
      - name: Replot the retained Geant4 tracker material profiles
        run: >-
          python -B software/analysis/material_profiles/plot_profiles.py
          --data docs/validation/geantino-material-profiles/profiles.json
          --output build/material-profiles
      - name: Check finite Gen3 material-survey geometry and replay its figures
        run: |
          python -B -m unittest discover -s software/analysis/gen3_material_mapping -p 'test_*.py' -v
          python -B software/analysis/gen3_material_mapping/export_tables.py --data docs/validation/gen3-material-mapping --check
          python -B software/analysis/gen3_material_mapping/plot.py --data docs/validation/gen3-material-mapping --output build/gen3-material-mapping-replay
      - name: Audit retained native material map and replay the total validation overlay
        run: |
          python -B software/analysis/gen3_material_mapping/verify_trial.py
          python -B software/analysis/gen3_material_mapping/plot_validation.py --truth docs/validation/geantino-material-profiles/profiles.json --validation docs/validation/gen3-material-map-run/validation-profiles.json --selection docs/validation/gen3-material-map-run/selection.json --output build/gen3-material-map-run-replay
      - name: Audit and replay cumulative material requested by expert review
        run: >-
          python -B software/analysis/gen3_material_mapping/plot_cumulative.py
          --data docs/validation/gen3-material-map-run/cumulative/profiles.json.gz
          --output build/gen3-cumulative-material-replay
      - name: Check truth-tracking analysis and replay retained performance
        run: |
          python -B -m unittest discover -s software/analysis/truth_tracking -p 'test_*.py' -v
          python -B software/analysis/truth_tracking/plot_profiles.py --data docs/validation/truth-tracking-baseline/profiles.json.gz --output build/truth-tracking-baseline-replay
          python -B software/analysis/truth_tracking/plot_pulls.py --data docs/validation/truth-tracking-baseline/pulls/distributions.json.gz --output build/truth-tracking-baseline-replay/pulls
          python -B software/analysis/truth_tracking/plot_smearing.py --data docs/validation/truth-tracking-baseline/smearing/comparison.json.gz --output build/truth-tracking-smearing-replay
      - name: Check constrained tracker optimisation and retained confirmation evidence
        run: |
          python -B -m unittest discover -s software/analysis/tracker_optimization -p 'test_*.py' -v
          python -B software/analysis/tracker_optimization/verify.py --data docs/validation/tracker-resolution-optimization/confirmation-geometric.json.gz --reports docs/validation/tracker-resolution-optimization/native-confirmation-geometric-reports.json.gz --prefix confirmation/geometric
          python -B software/analysis/tracker_optimization/verify.py --data docs/validation/tracker-resolution-optimization/confirmation-gaussian.json.gz --reports docs/validation/tracker-resolution-optimization/native-confirmation-gaussian-reports.json.gz --prefix confirmation/gaussian
          python -B software/analysis/tracker_optimization/verify.py --data docs/validation/tracker-resolution-optimization/late-confirmation-geometric.json.gz --reports docs/validation/tracker-resolution-optimization/native-late-confirmation-geometric-reports.json.gz --prefix confirmation-late/geometric
          python -B software/analysis/tracker_optimization/verify.py --data docs/validation/tracker-resolution-optimization/late-confirmation-gaussian.json.gz --reports docs/validation/tracker-resolution-optimization/native-late-confirmation-gaussian-reports.json.gz --prefix confirmation-late/gaussian
          python -B software/analysis/tracker_optimization/plot.py --input docs/validation/tracker-resolution-optimization/confirmation-geometric.json.gz --output build/tracker-optimisation-replay
      - name: Check float32 material-boundary rounding cells
        run: |
          c++ -std=c++17 software/analysis/material_profiles/test_rounding_cell.cpp -o build/test-rounding-cell
          build/test-rounding-cell
      - name: Check tracker crossing accounting and population profiles
        run: python -B -m unittest discover -s tools/tracker_propagation -p 'test_*.py' -v
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Revision-specific reviews need historical document content.
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate PR title and require project tracking updates
        run: python3 -B tools/project_records/check_update.py --event "$GITHUB_EVENT_PATH"
      - name: Fetch recorded historical Git evidence
        run: python3 -B tools/project_records/fetch_evidence.py
      - name: Validate project records
        run: python3 -B tools/project_records/validate.py
      - name: Test calorimeter hardware ownership and physical controls
        run: python3 -B -m unittest discover -s tools/calorimeter_hardware -p 'test_*.py' -v
      - name: Test Si-W service and forward envelope allocations
        run: |
          python3 -B -m unittest discover -s tools/siw_services -p 'test_*.py' -v
          python3 -B tools/siw_services/study.py --check
          python3 -B tools/layout_overview/draw.py --check
      - name: Test common FCAL finite geometry and readout controls
        run: |
          python3 -B -m unittest discover -s tools/forward_calorimeter -p 'test_*.py' -v
          python3 -B tools/forward_calorimeter/study.py --check
      - name: Validate specialist profiles, skills and assignment controls
        run: |
          python3 -B tools/agent_workflow/workflow.py validate
          python3 -B -m unittest discover -s tools/agent_workflow -p 'test_*.py' -v
      - name: Test calorimeter source audit arithmetic and accounting
        run: python3 -B -m unittest discover -s tools/calorimeter_audit -p 'test_*.py' -v
      - name: Test public tracker prototype controls
        run: |
          python3 -m pip install -r tools/tracker_layout/requirements-controls.txt
          python3 -B -m unittest discover -s tools/tracker_layout -p 'test_*.py' -v
      - name: Test solenoid vacuum sizing and interface controls
        run: python3 -B -m unittest discover -s tools/solenoid_baseline -p 'test_*.py' -v
      - name: Verify retained ODD IdRes documentation data
        run: |
          python3 -B -m unittest discover -s tools/odd_idres -p 'test_*.py' -v
          python3 -B tools/odd_idres/verify.py
      - name: Test magnetic sizing and field controls
        run: python3 -B -m unittest discover -s tools/magnetic_study -p 'test_*.py' -v
      - name: Test finite-module geometry and coverage controls
        run: python3 -B -m unittest discover -s tools/module_layout -p 'test_*.py' -v
      - name: Test pixel barrel z-packing controls
        run: python3 -B -m unittest discover -s tools/pixel_z_coverage -p 'test_*.py' -v
      - name: Test pixel endcap support design controls
        run: python3 -B -m unittest discover -s tools/pixel_endcap_support -p 'test_*.py' -v
      - name: Test pixel disc overlap optimization controls
        run: |
          python3 -m pip install -r tools/pixel_disc_optimization/requirements.txt
          python3 -B -m unittest discover -s tools/pixel_disc_optimization -p 'test_*.py' -v
      - name: Test pixel disc support variant controls
        run: python3 -B -m unittest discover -s tools/pixel_disc_support_variants -p 'test_*.py' -v
      - name: Test eta-limited pixel disc apertures
        run: python3 -B -m unittest discover -s tools/pixel_disc_eta_apertures -p 'test_*.py' -v
      - name: Test DD4hep pixel compact export controls
        run: python3 -B -m unittest discover -s tools/pixel_barrel_dd4hep -p 'test_*.py' -v
      - name: Test combined preliminary pixel export
        run: python3 -B -m unittest discover -s tools/pixel_detector_dd4hep -p 'test_*.py' -v
      - name: Test beampipe and combined tracker integration guards
        run: |
          python3 -B -m unittest discover -s tools/beampipe -p 'test_*.py' -v
          python3 -B -m unittest discover -s tools/tracker_dd4hep -p 'test_*.py' -v
      - name: Test material benchmark selection and profiler accounting
        run: python3 -B -m unittest discover -s tools/material_recording_profile -p 'test_*.py' -v
      - name: Test short-strip barrel prototype controls
        run: python3 -B -m unittest discover -s tools/short_strip_barrel -p 'test_*.py' -v
      - name: Short-strip endcap controls
        run: python3 -B -m unittest discover -s tools/short_strip_endcap -p 'test_*.py' -v
      - name: Long-strip barrel and endcap structural prototype controls
        run: |
          python3 -B -m unittest discover -s tools/long_strip_barrel -p 'test_*.py' -v
          python3 -B -m unittest discover -s tools/long_strip_endcap -p 'test_*.py' -v
      - name: Test optional nodehammer display safeguards
        run: python3 -B -m unittest discover -s tools/nodehammer -p 'test_*.py' -v
      - name: Test project records and documentation links
        run: |
          python3 -B -m unittest discover -s tools/project_records -p 'test_*.py' -v
          python3 -B -m unittest discover -s tools/session_logging -p 'test_*.py' -v
          python3 -B tools/session_logging/session_log.py validate
      - name: Test node-aware software preflight
        run: python3 -B -m unittest discover -s skills/acts-spack/scripts -p 'test_*.py' -v
